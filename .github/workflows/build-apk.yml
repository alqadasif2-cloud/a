name: Build Android APK - AM

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'نوع البناء (Build Type: debug أو release أو both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

permissions:
  contents: write

jobs:
  build-apk:
    name: 📱 Build A«»M Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🟢 Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 🤖 Setup Android SDK & Accept Licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses 2>/dev/null || true
          elif [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: 📦 Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🌐 Build Vite Web Assets
        run: |
          npm run build

      - name: 🔄 Sync Capacitor and Prepare Android Project
        run: |
          # 1. Ensure android directory exists
          if [ ! -d "android" ]; then
            echo "⚡ android/ folder not found. Adding Android platform via Capacitor..."
            npx cap add android
          else
            echo "⚡ android/ folder exists. Syncing web assets and plugins..."
            npx cap sync android
          fi

          # 2. Ensure settings.gradle exists (CRITICAL: enables :app subproject detection)
          if [ ! -f "android/settings.gradle" ]; then
            echo "⚡ Creating missing android/settings.gradle..."
            cat << 'EOF' > android/settings.gradle
include ':app'
apply from: 'capacitor.settings.gradle'

if (new File(rootDir, 'capacitor-cordova-android-plugins').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = new File(rootDir, 'capacitor-cordova-android-plugins')
}
EOF
          fi

          # 3. Configure Android SDK path in local.properties
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          fi

          # 4. Ensure gradlew wrapper exists
          if [ ! -f "android/gradlew" ]; then
            echo "⚡ android/gradlew not found, generating wrapper with Gradle 8.11.1..."
            cd android
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
            cd ..
          fi

          # 5. Ensure executable permissions
          chmod +x android/gradlew 2>/dev/null || true

      - name: 🔨 Build Android Debug APK
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: 🔨 Build Android Release APK (Unsigned)
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: 📤 Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-App-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}"
        uses: actions/upload-artifact@v4
        with:
          name: AM-App-Release-Unsigned-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📋 Summary
        run: |
          echo "### 📱 تم بناء تطبيق A«»M بنجاح!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **نوع البناء:** ${{ github.event.inputs.build_type || 'debug (تلقائي)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ملفات الـ APK المتاحة للتحميل:** انتقل إلى قسم **Artifacts** في أعلى هذه الصفحة لتحميل الملف مباشرة إلى هاتفك." >> $GITHUB_STEP_SUMMARY
